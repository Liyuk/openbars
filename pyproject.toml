[project]
name = "openbars"
version = "0.0.1"
description = "Free, multi-market, multi-source OHLCV bar collection, cleaning and reconciliation into one canonical dataset."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Liyuk" }]
keywords = ["market-data", "ohlcv", "stocks", "crypto", "etl", "duckdb", "parquet"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "exchange-calendars>=4.9,<5",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15", "duckdb>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
yfinance = ["yfinance>=0.2"]
dev = [
    "pyarrow>=15",
    "pytest>=8",
]

[project.scripts]
openbars = "openbars.cli.main:main"

[project.entry-points."openbars.calendars"]
xnys = "openbars.calendars.xnys:XNYSCalendar"
crypto = "openbars.calendars.crypto:CryptoCalendar"

[project.entry-points."openbars.providers"]
alpaca = "openbars.providers.us.alpaca:AlpacaProvider"
massive = "openbars.providers.us.massive:MassiveProvider"
yfinance = "openbars.providers.us.yfinance:YFinanceProvider"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# third-party deprecation emitted by exchange-calendars on newer pandas
filterwarnings = ["ignore:Series.values returning an ndarray:Warning"]
