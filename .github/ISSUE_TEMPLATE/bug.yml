name: Bug
description: 缺陷报告
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、配置片段（去掉密钥）、市场/粒度/provider
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: openbars 版本 / Python 版本 / OS / 存储后端 / 采集节点
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 日志、fetch_log 片段、截图。不要贴 API key 或数据源原始数据全文。
