version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock.
  # The `uv` ecosystem already covers the pip requirements, so no separate
  # `pip` entry is added for the same directory (that would open duplicate PRs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
