# openbars example configuration. `openbars init` writes it as config.yaml (git-ignored).
# Secrets are referenced as ${ENV_VAR}; never write keys inline.
#
# Optional dotenv file (never commit it). Resolution, highest wins:
#   1. process environment
#   2. env file (--env-file, else OPENBARS_ENV_FILE, else this key,
#      else .env next to this file when it exists)
#   3. ${VAR:-default} below
# Literal values here are used as written.
# `openbars config` prints the effective settings; secret values are redacted.
# env_file: .env
version: 1

# 选择市场（多选）: us | crypto | cn | hk
# 默认只跑美股。改用加密货币：`markets: [crypto]`，再把下方 providers.binance / providers.coinbase
# 设为 enabled: true，并在 universe.crypto.symbols 写交易对即可（无需 API key）。
# 改用 A 股：`markets: [cn]`，启用 providers.baostock，并在 universe.cn.symbols 写代码
# 改用港股：`markets: [hk]`，启用 providers.yfinance（规划器只用这一源），并在 universe.hk.symbols 写代码
# （如 sh.600000 / 600000.SH；裸 6 位代码会被跳过）即可 plan / run（默认仍关闭）。
markets: [us]

# 选择粒度（多选）: 1d (default) | 1h | 30m | 15m | 5m | 1m
# 非日线粒度会触发对应 provider 的额外限额规则与回补预算检查。
intervals: [1d]

# 历史回补范围
history:
  start: 2016-01-01        # or "max"
  end: null                # null = today

universe:
  us:
    # Explicit symbols (Alpaca / yfinance jobs need them; Massive plans the whole market):
    # symbols: [TEST1, ZZZA]
    include: [common_stock, etf]   # adr, preferred, ... 可选
    exclude_otc: true
  # 加密货币（markets 含 crypto 时生效）。按 provider 的原生 symbol 书写：
  #   Binance:  字母数字，如 TESTUSDT（只发给 binance）
  #   Coinbase: BASE-QUOTE 产品 id，如 TEST-USDT（只发给 coinbase）
  # 日线按 UTC 00:00 切日，周末也是交易日；两家交易所是两个独立 instrument，不合并。
  # crypto:
  #   symbols: [TESTUSDT, TEST-USDT]
  # A 股（markets 含 cn 时生效）。symbol 写 BaoStock 原生 `sh.600000` / `sz.000001`，或 `600000.SH`
  # 等写法（同一只股票的多种写法只规划一次）；日期按上海时间，交易日取沪深日历（XSHG），
  # 收盘 15:00 后再等 30 分钟才认为当日可取。
  # cn:
  #   symbols: [sh.600000, sz.000001]

storage:
  backend: parquet_duckdb  # parquet_duckdb | postgres
  path: ./data
  postgres:
    dsn: ${OPENBARS_PG_DSN}
    mode: native           # native | upstream_compat（compat 永不做迁移，只做列级校验）
    write: false           # 默认只读；写入需显式 true。upstream_compat 在 write: true 时写入已有表（含公司行动）
    quota: sqlite          # sqlite | postgres。compat 下选 postgres 则与 upstream 共用 provider_request_gate / usage（永不迁移）
    # dsn 只在运行时解析（环境变量 / env 文件），不要把真实 DSN 写进仓库

conventions:
  adjustment: split        # raw | split | split_dividend | all（查询时派生，落库只存不复权+公司行动）
  us_hourly_alignment: session_open   # session_open (9:30) | clock_hour
  include_extended_hours: false

providers:
  alpaca:
    enabled: true
    feed: sip              # sip | iex —— 成交量不得跨 feed 混用
    key_id: ${ALPACA_API_KEY_ID}
    secret_key: ${ALPACA_API_SECRET_KEY}
    # quota 留空则使用 provider 声明的默认免费额度；可在此收紧。
    # 要调高（超过默认值）必须显式写 override: true，否则报错：
    #   quota: { per_minute: 999, override: true }
    quota: { per_minute: 190 }
  massive:
    enabled: true
    api_key: ${MASSIVE_API_KEY}
    quota: { per_minute: 4 }
  yfinance:
    enabled: true
    quota: { per_minute: 30 }
  alpha_vantage:
    enabled: false
    api_key: ${ALPHA_VANTAGE_API_KEY}
    role: audit            # primary | fallback | audit
  # 加密货币（公开行情，无需 key）。默认关闭，不影响仅美股的首次运行。
  binance:
    enabled: false
    base_url: https://data-api.binance.vision
  coinbase:                # Coinbase Exchange 公开 candles
    enabled: false
    base_url: https://api.exchange.coinbase.com
  # A 股日线（BaoStock，无需 token）。默认关闭；需安装可选依赖 `pip install openbars[baostock]`。
  # 存不复权价（adjustflag=3），并取复权因子与停牌字段；限额无官方数字，默认保守。仅限个人本地使用。
  # 启用后 `markets: [cn]` + `universe.cn.symbols` 即可：原始行含停牌占位，规范层（cn-daily-v1）
  # 存 RAW、不写停牌占位、标记涨跌停；前/后复权（qfq / hfq）在读取时由复权因子派生。
  baostock:
    enabled: false

# 多源仲裁：按 市场 × 粒度 × 字段 配置优先级
reconcile:
  us:
    1d:
      price: [massive, alpaca, yfinance]
      volume: [alpaca]     # 只用同一 feed
  tolerances:
    price_rel: 0.005
    volume_rel: 0.05         # research-daily-v2 defaults: price 0.5%, volume 5% (read by `openbars verify`)

# 采集节点：本机或远程（例如需要国内网络的 A 股/港股）
nodes:
  - name: local
    kind: local
  # - name: cn-node
  #   kind: remote
  #   url: https://cn-node.example.com
  #   token: ${OPENBARS_NODE_TOKEN}
  #   markets: [cn, hk]

schedule:
  daily_at: "06:30"        # in timezone below
  timezone: America/New_York
