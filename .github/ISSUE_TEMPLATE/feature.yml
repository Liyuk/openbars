name: Feature
description: A new feature or capability (agree on it in Discussions first)
labels: ["feature"]
body:
  - type: input
    id: discussion
    attributes:
      label: Related Discussion
      placeholder: https://github.com/Liyuk/openbars/discussions/...
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Why do this, and which problem does it solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is not; which layers are involved (provider / scheduler / normalize / storage / cli)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable checks (tests, command output, data metrics)
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      placeholder: "Depends on #..."
